lint:
  oversized_card_max_elements: 20
  oversized_board_max_cards: 200
  max_warnings: 50

features:
  board_ttl_days: 30
  link_preview_enabled: true

# auth.mode: 'jwt'      → User pastes their own JWT (production default)
# auth.mode: 'password' → Server logs in with NBC_EMAIL + NBC_PASSWORD from .env
#                         JWT field is hidden in the UI; no credentials are exposed to users
auth:
  mode: jwt
